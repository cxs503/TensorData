name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          TENSORDATA_API_KEY: ci-test-key
        run: pytest
      - name: Lint changed physics-validator scope
        # The repository-wide lint baseline currently has unrelated legacy findings.
        # Keep this PR's new validator and its tests lint-clean without masking test failures.
        run: ruff check tensordata/quality/physics_csv.py tests/test_physics_csv_validator.py
